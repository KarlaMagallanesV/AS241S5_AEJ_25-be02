server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: PetEmergency
  r2dbc:
    url: ${R2DBC_URL}
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    org.springframework.r2dbc: DEBUG

rapidapi:
  key: ${RAPIDAPI_KEY}